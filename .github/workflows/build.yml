name: Build BMC5Crossplay

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: bash ./gradlew clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BMC5Crossplay-0.1.0
          path: build/libs/BMC5Crossplay-0.1.0.jar
